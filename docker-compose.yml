# Chain, server, frontend and MongoDB for a shared machine (deploy/README.md).
#
#   docker compose up -d --build     start (or update) everything
#   docker compose logs -f server    follow one service
#   docker compose down              stop; `down -v` also deletes the databases
#
# Every port is published on 127.0.0.1 only, the same addresses startup.py uses, so nothing is
# reachable from other machines until you forward it (deploy/README.md: Tailscale).
# Ports can be moved in .env next to this file, e.g. SERVER_PORT=5100 while startup.py also runs.
name: offbalance

services:
  mongo:
    # not 8.x: MongoDB 8 refuses to start on Linux kernel 6.19+ (https://jira.mongodb.org/browse/SERVER-121912)
    image: mongo:7.0
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 }).ok"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 60s
      start_interval: 2s

  # restarting this wipes the chain (Hardhat keeps it in memory); the server follows it onto a
  # fresh database, see deploy/server-entrypoint.sh
  chain:
    build: { context: ., dockerfile: deploy/chain.Dockerfile }
    restart: unless-stopped
    ports:
      - "127.0.0.1:${CHAIN_PORT:-8545}:8545"
    volumes:
      - deployments:/app/blockchain/deployments

  server:
    build: { context: ., dockerfile: deploy/server.Dockerfile }
    restart: unless-stopped
    env_file: dev.env # SERVER_PRIVATE_KEY: the dev deployer, which is the contract's server
    environment:
      CHAIN: "on"
      RPC_URL: http://chain:8545
      MONGO_URL: mongodb://mongo:27017
      PORT: "5000"
      # `server` is the name the frontend container proxies to
      TLS_CERT_HOSTS: server
      TLS_CERT_DAYS: "365"
      # Dockerfile builds (REGISTRY_NAMESPACE etc.) need a docker CLI, which this image doesn't have
    ports:
      - "127.0.0.1:${SERVER_PORT:-5000}:5000"
    volumes:
      - deployments:/app/blockchain/deployments:ro
      - tls:/app/server/.local/tls
    depends_on:
      mongo: { condition: service_healthy }
      chain: { condition: service_healthy, restart: true }

  frontend:
    build: { context: ., dockerfile: deploy/frontend.Dockerfile }
    restart: unless-stopped
    environment:
      VITE_API_MODE: api
      VITE_API_BASE_URL: /api
      API_PROXY_TARGET: https://server:5000
      API_CA_FILE: /tls/cert.pem
      # names other than localhost the page may be opened under; .ts.net covers `tailscale serve`
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-.ts.net}
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-5173}:5173"
    volumes:
      - tls:/tls:ro
    depends_on:
      server: { condition: service_healthy, restart: true }

volumes:
  mongo-data:
  deployments:
  tls:
