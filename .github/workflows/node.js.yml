name: Frontend CI

on:
  push:
    branches: [main]
    paths: ['frontend/**', '.github/workflows/node.js.yml']
  pull_request:
    branches: [main]
    paths: ['frontend/**', '.github/workflows/node.js.yml']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Check demo and API browser flows
        run: |
          npm run dev:demo -- --port 5173 --strictPort > /tmp/offbalance-demo.log 2>&1 &
          demo_pid=$!
          npm run dev -- --port 5174 --strictPort > /tmp/offbalance-api.log 2>&1 &
          api_pid=$!
          trap 'kill "$demo_pid" "$api_pid" 2>/dev/null || true' EXIT
          node --input-type=module <<'JS'
          for (const port of [5173, 5174]) {
            let ready = false;
            for (let attempt = 0; attempt < 100; attempt++) {
              try { ready = (await fetch(`http://127.0.0.1:${port}`)).ok; } catch {}
              if (ready) break;
              await new Promise(resolve => setTimeout(resolve, 100));
            }
            if (!ready) throw new Error(`Vite on port ${port} did not start.`);
          }
          JS
          npm run test:browser
