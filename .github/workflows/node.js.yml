name: Frontend and server integration

on:
  push:
    branches: [main]
    paths: ['frontend/**', 'server/**', 'client/**', 'blockchain/**', 'dev.env', 'startup.py', '.github/workflows/node.js.yml']
  pull_request:
    branches: [main]
    paths: ['frontend/**', 'server/**', 'client/**', 'blockchain/**', 'dev.env', 'startup.py', '.github/workflows/node.js.yml']

permissions:
  contents: read

jobs:
  build:
    # MongoDB 8.0 rejects Linux 6.19+ (SERVER-121912); this image uses kernel 6.8.
    runs-on: ubuntu-22.04
    services:
      mongo:
        image: mongo:8.0
        ports: ['27017:27017']
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1}).ok'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      MONGODB_URI: mongodb://127.0.0.1:27017
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            server/package-lock.json
            blockchain/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests docker
      - name: Check provider availability and execution
        run: python -m unittest discover -s ../client/test -v
      - run: npm ci
      - run: npm ci --prefix ../server
      - run: npm ci --prefix ../blockchain
      - name: Check contract
        working-directory: blockchain
        run: npx hardhat test
      - run: npm test
      - run: npm run build
      # includes test:e2e, which runs the server's orchestrator against a real Hardhat node
      - run: npm --prefix ../server test
      - run: npx playwright install --with-deps chromium
      - name: Check demo browser flows
        run: |
          npm run dev:demo -- --port 5173 --strictPort > /tmp/offbalance-demo.log 2>&1 &
          demo_pid=$!
          trap 'kill "$demo_pid" 2>/dev/null || true' EXIT
          node --input-type=module <<'JS'
          let ready = false;
          for (let attempt = 0; attempt < 100; attempt++) {
            try { ready = (await fetch('http://127.0.0.1:5173')).ok; } catch {}
            if (ready) break;
            await new Promise(resolve => setTimeout(resolve, 100));
          }
          if (!ready) throw new Error('Demo Vite did not start.');
          JS
          npm run test:browser
      - name: Check browser against HTTPS server and MongoDB
        run: npm run test:integration
