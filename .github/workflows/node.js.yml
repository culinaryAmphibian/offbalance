name: Frontend and server integration

on:
  push:
    branches: [main, milestone4]
    paths: ['frontend/**', 'server/**', 'client/**', 'blockchain/**', 'dev.env', 'startup.py', 'docker-compose.yml', '.github/workflows/node.js.yml']
  pull_request:
    branches: [main, milestone4]
    paths: ['frontend/**', 'server/**', 'client/**', 'blockchain/**', 'dev.env', 'startup.py', 'docker-compose.yml', '.github/workflows/node.js.yml']

permissions:
  contents: read

jobs:
  build:
    # MongoDB 8.0 rejects Linux 6.19+ (SERVER-121912); this image uses kernel 6.8.
    runs-on: ubuntu-22.04
    services:
      mongo:
        image: mongo:8.0
        ports: ['27017:27017']
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1}).ok'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      MONGODB_URI: mongodb://127.0.0.1:27017
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            server/package-lock.json
            blockchain/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests docker web3 pycryptodome
      - name: Check provider availability and execution
        run: python -m unittest discover -s ../client/test -v
      - run: npm ci
      - run: npm ci --prefix ../server
      - run: npm ci --prefix ../blockchain
      - name: Check contract
        working-directory: blockchain
        run: npx hardhat test
      # needs blockchain/ installed, so it can't run with the other client tests above
      - name: Check provider client against a real chain
        run: python -m unittest discover -s ../client/test -p test_chain_integration.py -v
      - run: npm test
      - run: npm run test:components
      - run: npm run build
      # includes test:e2e, which runs the server's orchestrator against a real Hardhat node
      - run: npm --prefix ../server test
      - run: npx playwright install --with-deps chromium firefox webkit
      - name: Check demo browser flows
        run: |
          npm run dev:demo -- --port 5173 --strictPort > /tmp/offbalance-demo.log 2>&1 &
          demo_pid=$!
          trap 'kill "$demo_pid" 2>/dev/null || true' EXIT
          node --input-type=module <<'JS'
          let ready = false;
          for (let attempt = 0; attempt < 100; attempt++) {
            try { ready = (await fetch('http://127.0.0.1:5173')).ok; } catch {}
            if (ready) break;
            await new Promise(resolve => setTimeout(resolve, 100));
          }
          if (!ready) throw new Error('Demo Vite did not start.');
          JS
          npm run test:browser
          BROWSER=firefox npm run test:browser
          BROWSER=webkit npm run test:browser
          npm run test:a11y
      - name: Check browser against HTTPS server and MongoDB
        run: npm run test:integration
      - name: Check browser wallet flows against a real chain
        run: npm run test:chain-browser

  results:
    # Keep result delivery checks independent of the contract toolchain job.
    runs-on: ubuntu-22.04
    services:
      mongo:
        image: mongo:8.0
        ports: ['27017:27017']
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1}).ok'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      MONGODB_URI: mongodb://127.0.0.1:27017
      RESULT_STORAGE: local
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            server/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests docker web3 pycryptodome
      - run: npm ci --prefix server
      - run: npm ci --prefix frontend
      - name: Check result storage and verified delivery with MongoDB
        run: |
          npm --prefix server run typecheck
          npm --prefix server run test:storage
      - name: Check provider execution and result uploads
        run: python -m unittest discover -s client/test -v
      - name: Check buyer frontend and build
        run: |
          npm --prefix frontend test
          npm --prefix frontend run build

  system:
    # The whole stack with nothing mocked: chain, HTTPS server, MongoDB and three real provider
    # clients running real Docker jobs (server/test/system-full-stack.test.ts, about 8 minutes).
    runs-on: ubuntu-22.04
    services:
      mongo:
        image: mongo:8.0
        ports: ['27017:27017']
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1}).ok'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      MONGODB_URI: mongodb://127.0.0.1:27017
      TEST_PYTHON: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            blockchain/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r client/requirements.txt
      - run: npm ci --prefix server
      - run: npm ci --prefix blockchain
      - name: Run jobs through the full stack with three real provider clients
        run: npm --prefix server run test:system

  compose-smoke:
    # `docker compose --profile host` plus one provider container, one job end to end
    # (server/test/system/compose-smoke.ts).
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci --prefix server
      - name: Start host mode
        run: |
          echo "HOST_ADDRESS=$(hostname -I | awk '{print $1}')" > .env
          docker compose --profile host up -d --build --wait mongo blockchain server
      - name: Start a provider on the host
        run: docker compose --profile host run -d --rm host-client --dev --provider 1
      - name: Run one job through the compose stack
        run: |
          docker compose --profile host cp server:/app/server/.local/tls/cert.pem "$RUNNER_TEMP/offbalance-cert.pem"
          CA_FILE="$RUNNER_TEMP/offbalance-cert.pem" node server/test/system/compose-smoke.ts
      - name: Container logs
        if: failure()
        run: docker compose --profile host --profile host-provider logs --no-color --tail 200
      - name: Stop
        if: always()
        run: docker compose --profile host --profile host-provider down -v

  static-analysis:
    # Slither on the contract; fails only on High findings (the current Medium is a reviewed false
    # positive, see TESTING_PLAN.md)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install slither-analyzer solc-select
      - run: solc-select install 0.8.34 && solc-select use 0.8.34
      - name: Slither
        run: slither blockchain/contracts/OffBalance.sol --compile-force-framework solc --fail-high
